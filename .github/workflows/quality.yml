name: DocSync Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: >
          pip install fastapi "uvicorn[standard]" typer jinja2 pydantic
          pytest ruff black pyyaml httpx

      - name: Run tests
        run: pytests

      - name: Run linter
        run: ruff check .

      - name: Check formatting
        run: black --check .